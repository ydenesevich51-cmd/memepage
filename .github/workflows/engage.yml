name: engage

on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 hours. Edit to taste.
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: memebot

jobs:
  engage:
    if: vars.REPLIES == 'dry' || vars.REPLIES == 'auto'   # does nothing until you turn it on
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      REPLIES: ${{ vars.REPLIES }}
      MAX_REPLIES: ${{ vars.MAX_REPLIES }}
      NICHE: ${{ vars.NICHE }}
      VOICE: ${{ vars.VOICE }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      GH_MODELS: ${{ vars.GH_MODELS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python memebot.py engage
      - name: Save which comments are done
        run: |
          git config user.name memebot
          git config user.email memebot@users.noreply.github.com
          git add -A
          git commit -m "memebot: replies" || echo "nothing to commit"
          git pull --rebase
          git push
